# Add inside the nginx server block that serves the web build. The game connects to
# ws(s)://<same host>/versus by default.
location /versus {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

# The .js and .wasm keep their names between builds, so make browsers revalidate them
location ~* \.(js|wasm|data)$ {
    add_header Cache-Control "no-cache";
}
