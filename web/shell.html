<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Plants vs. Zombies</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			overflow: hidden;
			background: #000;
			color: #e8e8e8;
			font-family: system-ui, sans-serif;
		}

		/* SDL sizes the drawing buffer to match this CSS size; the game letterboxes itself to 4:3 */
		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			outline: none;
		}

		#overlay {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			background: #000;
		}

		#panel {
			max-width: 28rem;
			text-align: center;
			line-height: 1.5;
		}

		#panel h1 {
			font-size: 1.5rem;
			margin: 0 0 1rem;
		}

		#status {
			min-height: 1.5em;
			color: #a8a8a8;
		}

		button, label.button {
			display: inline-block;
			margin-top: 1rem;
			padding: 0.6rem 1.4rem;
			border: 0;
			border-radius: 6px;
			background: #4caf50;
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}

		button:hover, label.button:hover {
			background: #43a047;
		}

		#picker input {
			display: none;
		}

		[hidden] {
			display: none !important;
		}
	</style>
</head>
<body>
	<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

	<div id="overlay">
		<div id="panel">
			<h1>Plants vs. Zombies</h1>
			<div id="status">Downloading…</div>

			<div id="picker" hidden>
				<p>
					Choose your Plants vs. Zombies GOTY folder. It needs to contain
					<code>main.pak</code> and the <code>properties</code> folder.
					The files stay in this browser tab and are not uploaded anywhere.
				</p>
				<label class="button">
					Choose game folder
					<input id="folder" type="file" webkitdirectory multiple>
				</label>
			</div>

			<button id="play" hidden>Play</button>
		</div>
	</div>

	<script>
		const overlay = document.getElementById('overlay');
		const statusText = document.getElementById('status');
		const picker = document.getElementById('picker');
		const folderInput = document.getElementById('folder');
		const playButton = document.getElementById('play');
		const canvas = document.getElementById('canvas');

		function setStatus(text) {
			statusText.textContent = text;
		}

		function showPlayButton() {
			picker.hidden = true;
			setStatus('');
			playButton.hidden = false;
		}

		var Module = {
			canvas: canvas,

			setStatus: function (text) {
				// Emscripten reports download progress as "Downloading data... (12/34)"
				const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
				if (match)
					setStatus('Downloading… ' + Math.round(100 * match[1] / match[2]) + '%');
				else if (text)
					setStatus(text);
			},

			onRuntimeInitialized: function () {
				if (Module.hasGameData()) {
					showPlayButton();
				} else {
					setStatus('');
					picker.hidden = false;
				}
			},

			onAbort: function (what) {
				overlay.hidden = false;
				picker.hidden = true;
				playButton.hidden = true;
				setStatus('The game crashed: ' + what + '. Check the browser console for details.');
			},
		};

		folderInput.addEventListener('change', async function () {
			if (!folderInput.files.length)
				return;

			setStatus('Loading game files…');
			picker.hidden = true;
			if (await Module.installGameData(folderInput.files)) {
				showPlayButton();
			} else {
				setStatus('That folder doesn\'t contain main.pak or properties/resources.xml.');
				picker.hidden = false;
			}
			folderInput.value = '';
		});

		// Starting from a click lets the game's audio play under browser autoplay rules
		playButton.addEventListener('click', function () {
			overlay.hidden = true;
			canvas.focus();
			Module.startGame();
		});

		window.addEventListener('error', function (event) {
			Module.onAbort(event.message);
		});
	</script>
	{{{ SCRIPT }}}
</body>
</html>
